name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: linux
    runs-on: ubuntu-24.04
    steps:
      # Pinned to the commit for actions/checkout v4, resolved 2026-11-22.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned to the commit for dtolnay/rust-toolchain stable, resolved 2026-11-22.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace
